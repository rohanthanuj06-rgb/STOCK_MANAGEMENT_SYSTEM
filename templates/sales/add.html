{% extends "layout.html" %}

{% block page_title %}New Sale Order{% endblock %}
{% block page_subtitle %}Process customer purchases and deduct stock automatically{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="glass-card p-5 border-0 shadow-lg border-start border-success border-4">
            <form method="POST" action="{{ url_for('sales.add') }}">
                
                <div class="row g-4 mb-4">
                    <div class="col-md-12">
                        <label class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 1px;">Customer Name</label>
                        <input type="text" name="customer_name" class="form-control premium-input shadow-sm" placeholder="Optional: Enter customer name">
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-8">
                        <label class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 1px;">Select Product</label>
                        <select name="product_id" class="form-select premium-input shadow-sm text-white" style="background-color: rgba(15, 23, 42, 0.6);" required>
                            <option value="" class="text-dark">Search inventory...</option>
                            {% for product in products %}
                                <option value="{{ product.id }}" class="text-dark">{{ product.name }} (Stock: {{ product.available_stock }} | Price: ${{ "%.2f"|format(product.base_price) }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-secondary small text-uppercase fw-bold mb-1" style="letter-spacing: 1px;">Quantity</label>
                        <input type="number" name="quantity" class="form-control premium-input shadow-sm" required min="1" value="1">
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-3 mt-4 pt-4 border-top border-secondary border-opacity-50">
                    <a href="{{ url_for('sales.index') }}" class="btn btn-outline-secondary text-white px-4">Cancel</a>
                    <button type="submit" class="btn btn-success px-5 shadow border-0" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <i class="bi bi-cart-check me-1"></i> Complete Sale
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
